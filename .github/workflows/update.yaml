name: update-data

on:
  schedule:
    # シーズン中（3〜10月）：JST 13:00〜23:45 のあいだ15分おき（GitHubの設定はUTCで書く）
    # デーゲームだけの日も、試合が終わってから15分以内に結果と成績を取り込む
    - cron: "*/15 4-14 * 3-10 *"
    # ナイターのあと成績の更新が遅い日のために、深夜0:00・0:30と朝9:00にも取りに行く
    - cron: "0,30 15 * 3-10 *"
    - cron: "0 0 * 3-10 *"
    # オフシーズン（11〜2月）：1日1回 JST 12:00（来季の日程が出たら自動で取り込む）
    - cron: "0 3 * 11,12,1,2 *"
  workflow_dispatch:

permissions:
  contents: write

# 同時に2つ動いて書き込みがぶつからないように、前の実行が終わるまで待つ
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_data.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # data/archive：シーズンの記録（公式戦がすべて終わったら保存。まだなければ何もしない）
          git add data/latest.json
          # data/tstats.json：チーム別成績（大きいので分けてある。成績タブを開いたときに読む）
          if [ -f data/tstats.json ]; then git add data/tstats.json; fi
          # data/records.json：NPBの歴代記録（1日1回だけ取り直す。記録タブを開いたときに読む）
          if [ -f data/records.json ]; then git add data/records.json; fi
          # data/venues.json（球場別成績）と data/boxcache.json（読んだ試合の出場成績。毎回読み直さないため）
          if [ -f data/venues.json ]; then git add data/venues.json; fi
          if [ -f data/boxcache.json ]; then git add data/boxcache.json; fi
          if [ -d data/archive ]; then git add data/archive; fi
          if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
          git commit -m "update data"
          # 途中でサイトのファイルがアップロードされていても押し返されないよう、最新に合わせてから送る
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
